{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock  %}</title>
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        {% block links %}{% endblock %}
    </head>
    <header>
        <div class="logo-image-div">
            <img src="{% static 'images/WorldIT.svg' %}" alt="World IT logo" class="logo-image">
        </div>
        <div class='conteiner'>
            <nav>
                <div class = 'nav-link'>
                    <div class="nav-image-div">
                        <img src="{% static 'images/house.svg' %}" alt="house" class="nav-image">
                    </div>
                    <a href="{% url 'home' %}">Головна</a>
                </div>
                <div class = 'nav-link'>
                    <div class="nav-image-div">
                        <img src="{% static 'images/house.svg' %}" alt="post" class="nav-image">
                    </div>
                    <a href="{% url 'post' %}">Мої публікації</a>
                </div>
                <div class = 'nav-link'>
                    <div class="nav-image-div">
                        <img src="{% static 'images/house.svg' %}" alt="friends" class="nav-image">
                    </div>   
                    <a href="{% url 'friends' %}">Друзі</a>
                </div>
                <div class = 'nav-link'>
                    <div class="nav-image-div">
                        <img src="{% static 'images/house.svg' %}" alt="house" class="nav-image">
                    </div>
                    <a href="#">Чати</a>
                </div>
                <div class = 'nav-link'>
                    <div class="nav-image-div">
                        <img src="{% static 'images/house.svg' %}" alt="settings" class="nav-image">
                    </div>   
                    <a href="{% url 'settings' %}">Налаштування</a>
                </div>
            </nav>
            <button class='logout'>
                <div class="logout-image-div">
                    <img src="{% static 'images/vector.svg' %}" alt="vector" class="logout-image">
                </div>  
                Вихід
            </button>
        </div>
    </header>
    <body>
        {% block content %}
            
        {% endblock %}
    </body>
</html>

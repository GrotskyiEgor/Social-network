{% load static %}

<div class="friends-container scrolls-container content-border-container" data-id='recommendations'> 
    <div class="friends-container-header">
        <p class="friends-container-title">Рекомендації</p>
        <p class="get-all-text" data-id="recommendations">Дивитись всі</p>
    </div>
    <div class="friends-container-content" id="recommendations">
        {% for profile in recommendations %}
            <div class="friends-container-block content-border-container">
                <div class="profile-user-image-container">
                    <img class="profile-user-image" src="{% static 'images/icons/indicator.svg' %}" alt="">
                </div>
                <div class="profile-username">
                    <p class="username-text">{{ profile.user.username }}</p>
                    <p class="pseudonym-text">{{ profile.pseudonym }}</p>
                </div> 
                <div class="block-buttomns">
                    <img class="friends-btn" src="{% static 'images/add_btn.svg' %}" alt="">
                    <img class="friends-btn" src="{% static 'images/delete_btn.svg' %}" alt="">                    
                </div>
            </div>
        {% endfor %}
    </div>
</div>

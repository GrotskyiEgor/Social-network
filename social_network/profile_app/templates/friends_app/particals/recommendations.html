{% load static %}

{% for profile in recommendations %}
    <div class="friends-container-block content-border-container">
        <div class="profile-user-image-container">
            <img class="profile-user-image" src="{% static 'images/icons/indicator.svg' %}" alt="">
        </div>
        <div class="profile-username">
            <a href="{% url 'profile' user_id=profile.id action='watch' %}" class="username-text">{{ profile.user.username }}</a>
            <a href="{% url 'profile' user_id=profile.id action='watch' %}" class="pseudonym-text">{{ profile.pseudonym }}</a>
            <!-- <p class="username-text">{{ user.username }}</p>
            <p class="pseudonym-text">{{ user.profile.pseudonym }}</p> -->
        </div> 

        {% include 'friends_app/particals/buttons/recommendations_btn.html' %}
    </div>
{% endfor %}
